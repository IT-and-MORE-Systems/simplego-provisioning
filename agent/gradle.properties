org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8

# The agent is plain Java. AGP 9 enables Kotlin by default, which adds the
# Kotlin standard library to the APK; the agent has no third-party libraries.
android.builtInKotlin=false

# Package name (applicationId) of the agent. Must match `agent_package` in the
# sxprov config. Default also in src/names.rs (DEFAULT_AGENT_PACKAGE).
sxprov.agentPackage=dev.simplego.provisioning.agent
